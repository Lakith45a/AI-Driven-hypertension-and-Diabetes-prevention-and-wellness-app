<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diabetes — Diabetes Staging Assessment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="index.html">Diabetes Staging Assessment Portal</a>
      </div>
    </nav>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <h3 class="card-title mb-3">Diabetes Stage Prediction</h3>
              <form id="diabetes-form">
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label">Age</label>
                    <input type="number" step="1" class="form-control" name="age" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">What is your gender?</label>
                    <select class="form-select" name="gender" required>
                      <option>Female</option>
                      <option>Male</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Height (cm)</label>
                    <input id="height-input" type="number" step="0.01" class="form-control" name="height" required>
                  </div>

                  <div class="col-md-4">
                    <label class="form-label">Weight (kg)</label>
                    <input id="weight-input" type="number" step="0.01" class="form-control" name="weight" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Waist circumference (inches)</label>
                    <input type="number" step="0.01" class="form-control" name="waist_circumference" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Diet / Food Habits (score)</label>
                    <input id="diet-input" type="number" step="0.1" class="form-control" name="diet_food_habits" required>
                    <div id="diet-source" class="form-text">Rate your typical diet on a 0 (poor) to 10 (excellent) scale.</div>
                  </div>

                  <div class="col-md-4">
                    <label class="form-label">Have you been diagnosed with high blood pressure?</label>
                    <select class="form-select" name="blood_pressure" required>
                      <option>No</option>
                      <option>Yes</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Do you have high cholesterol or abnormal lipid levels?</label>
                    <select class="form-select" name="cholesterol_lipid_levels" required>
                      <option>No</option>
                      <option>Yes</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Have you recently experienced vision changes?</label>
                    <select class="form-select" name="vision_changes" required>
                      <option>No</option>
                      <option>Yes</option>
                    </select>
                  </div>

                  <div class="col-md-4">
                    <label class="form-label">BMI</label>
                    <input id="bmi-input" type="number" step="0.1" class="form-control" name="bmi" required readonly>
                    <div class="form-text">Automatically calculated from height and weight (kg/m²).</div>
                  </div>

                </div>

                <div class="mt-4 d-flex justify-content-between align-items-center">
                  <div id="diabetes-result" class="text-muted"></div>
                  <div>
                    <button type="submit" class="btn btn-primary">Predict</button>
                    <a href="index.html" class="btn btn-outline-secondary ms-2">Back</a>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
