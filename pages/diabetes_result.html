<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diabetes Result — Diabetes Staging Assessment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="index.html">Diabetes Staging Assessment Portal</a>
      </div>
    </nav>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <h3 class="mb-3">Diabetes — Result</h3>
          <div id="result-area"></div>

          <div class="mt-4 d-flex gap-2">
            <a href="diabetes.html" class="btn btn-outline-primary">Back to Form</a>
            <button id="clear-btn" class="btn btn-outline-secondary">Clear Result</button>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
      (function(){
        const container = document.getElementById('result-area');
        const raw = localStorage.getItem('diabetes_result');
        const rawInput = localStorage.getItem('diabetes_input');
        if (!raw) {
          container.innerHTML = '<div class="alert alert-warning">No result found. Submit the diabetes form first.</div>';
          return;
        }
        let data; try { data = JSON.parse(raw); } catch(e){ data = { raw } }
        const resultDiv = document.createElement('div');
        resultDiv.className = 'mb-3';
        resultDiv.id = 'diabetes-result-full';
        container.appendChild(resultDiv);
        renderDiabetesResultFull(resultDiv, data);

        // submitted input intentionally not shown on the result page

        document.getElementById('clear-btn').addEventListener('click', function(){
          localStorage.removeItem('diabetes_result');
          localStorage.removeItem('diabetes_input');
          window.location.href = 'diabetes.html';
        });
      })();
    </script>
  </body>
</html>
